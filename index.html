<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
  </head>

  <body>
    <div id="wrapper">
      <h1>Dashboard</h1>

      <header>
        <div class="header-row-1">
          <label for="search-bar">
            <div class="search-icon icon-placeholder"></div>
            <input
              type="search" 
              name="search-bar" 
              id="search-bar"
            />
          </label>

          <div class="user-info">
            <div class="notification-icon icon-placeholder"></div>
            <div class="profile-img img-placeholder"></div>
            <p>Morgan Oakley</p>
          </div>
        </div>

        <div class="header-row-2">
          <div class="user-greeting">
            <div class="profile-img img-placeholder"></div>
            <h2>
              <span class="user-greeting-first-line">Hi there,</span><br>
              Morgan Oakley (@morgan)
            </h2>
          </div>

          <div class="button-list">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
          </div>
        </div>
      </header>

      <aside>
        <nav>
          <ul>
            <div class="nav-section-1">
              <li>
                <a href="">Home</a>
              </li>

              <li>
                <a href="">Profile</a>
              </li>

              <li>
                <a href="">Messages</a>
              </li>

              <li>
                <a href="">History</a>
              </li>

              <li>
                <a href="">Tasks</a>
              </li>

              <li>
                <a href="">Communities</a>
              </li>
            </div>

            <div class="nav-section-2">
              <li>
                <a href="">Settings</a>
              </li>

              <li>
                <a href="">Support</a>
              </li>

              <li>
                <a href="">Privacy</a>
              </li>
            </div>
          </ul>
        </nav>
      </aside>

      <main>
        <h2>Your Projects</h2>
      </main>
    </div>
  </body>
</html>
